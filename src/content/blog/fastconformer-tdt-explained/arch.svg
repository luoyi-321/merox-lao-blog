<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="760" height="580" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700" letter-spacing="0.5">FastConformer-TDT · Architecture Overview</text>

  <!-- ── AUDIO INPUT ── -->
  <rect x="290" y="56" width="180" height="48" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="380" y="75" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">🎤 Audio Input</text>
  <text x="380" y="93" text-anchor="middle" fill="#94a3b8" font-size="11">waveform (raw audio)</text>

  <!-- arrow -->
  <line x1="380" y1="104" x2="380" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── FEATURE EXTRACTION ── -->
  <rect x="260" y="128" width="240" height="52" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="380" y="149" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="600">Feature Extraction</text>
  <text x="380" y="168" text-anchor="middle" fill="#94a3b8" font-size="11">Log Mel-Spectrogram (80 bins)</text>

  <!-- arrow -->
  <line x1="380" y1="180" x2="380" y2="202" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── FASTCONFORMER ENCODER ── -->
  <rect x="90" y="204" width="580" height="192" rx="10" fill="#0f1f35" stroke="#22d3ee" stroke-width="2"/>
  <text x="380" y="226" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">FastConformer Encoder</text>
  <text x="380" y="242" text-anchor="middle" fill="#64748b" font-size="10">NVIDIA NeMo · ~2.4× faster than standard Conformer</text>

  <!-- sub-block 1: Subsampling -->
  <rect x="110" y="250" width="236" height="52" rx="7" fill="#162032" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="228" y="270" text-anchor="middle" fill="#0ea5e9" font-size="12" font-weight="600">8× Depthwise Subsampling</text>
  <text x="228" y="288" text-anchor="middle" fill="#94a3b8" font-size="10">compress time frames · 256 channels</text>

  <!-- sub-block 2: Conformer Block -->
  <rect x="414" y="250" width="236" height="52" rx="7" fill="#162032" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="532" y="270" text-anchor="middle" fill="#0ea5e9" font-size="12" font-weight="600">Conformer Block × N</text>
  <text x="532" y="288" text-anchor="middle" fill="#94a3b8" font-size="10">Conv (kernel=9) + Multi-Head Attention</text>

  <!-- connector between sub-blocks -->
  <line x1="346" y1="276" x2="414" y2="276" stroke="#334155" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- sub-block 3: Global Attention note -->
  <rect x="210" y="318" width="340" height="40" rx="6" fill="#0c1a2e" stroke="#334155" stroke-width="1"/>
  <text x="380" y="333" text-anchor="middle" fill="#64748b" font-size="10">Global context attention (XL variant)</text>
  <text x="380" y="348" text-anchor="middle" fill="#64748b" font-size="10">Supports audio &gt; 1 hour · Cache-aware streaming</text>

  <!-- arrow out of encoder -->
  <line x1="380" y1="396" x2="380" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── TDT DECODER ── -->
  <rect x="90" y="422" width="580" height="108" rx="10" fill="#1a0f35" stroke="#a78bfa" stroke-width="2"/>
  <text x="380" y="444" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">TDT Decoder  (Token-and-Duration Transducer)</text>

  <!-- Token Head -->
  <rect x="110" y="454" width="248" height="52" rx="7" fill="#211040" stroke="#c084fc" stroke-width="1.2"/>
  <text x="234" y="474" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="600">Token Head</text>
  <text x="234" y="492" text-anchor="middle" fill="#94a3b8" font-size="10">ທາຍຕົວໜັງສື / token ຈາກສຽງ</text>

  <!-- Duration Head -->
  <rect x="402" y="454" width="248" height="52" rx="7" fill="#211040" stroke="#c084fc" stroke-width="1.2"/>
  <text x="526" y="474" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="600">Duration Head</text>
  <text x="526" y="492" text-anchor="middle" fill="#94a3b8" font-size="10">ທາຍ duration (frames) ຂອງແຕ່ລະ token</text>

  <!-- merge line -->
  <line x1="358" y1="480" x2="402" y2="480" stroke="#4c1d95" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- arrow out -->
  <line x1="380" y1="530" x2="380" y2="552" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── OUTPUT ── -->
  <rect x="272" y="554" width="216" height="18" rx="6" fill="none"/>
  <text x="380" y="567" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">📝 Transcript Output</text>

  <!-- ── SPEED BADGE ── -->
  <rect x="604" y="396" width="136" height="22" rx="6" fill="#14532d"/>
  <text x="672" y="411" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">⚡ ~2.4× faster vs Conformer</text>

  <!-- ── ARROWHEAD MARKERS ── -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
